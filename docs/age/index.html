<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อายุหนอน (เกณฑ์ใหม่)</title>
<style>
:root{
  --bg:#2C3E50; --panel:#34495E; --fg:#ECF0F1; --blue:#3498DB; --green:#27AE60;
  --red:#E74C3C; --muted:#95A5A6; --sel:#F1C40F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,"Noto Sans Thai",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
/* purple header + thick bottom line = visibly NOT the 7-class page */
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px;background:#5B2C83;border-bottom:4px solid #F39C12}
header b{font-size:16px}
.chip{padding:2px 10px;border-radius:12px;background:#7D3C98;font-size:13px}
.chip.ok{background:#1e6b3c}.chip.warn{background:#8a6d1a}.chip.err{background:#8a2a22}
.spacer{flex:1}
#bar{height:6px;background:#1b2836}
#bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 16px 24px;gap:12px}
.views{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;position:relative}
.view{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 1 min(450px,max(200px,calc(100vh - 400px)));min-width:0}
.view h3{margin:0;font-size:14px;font-weight:bold;text-align:center}
.view small{color:var(--muted);font-size:12px;word-break:break-all;text-align:center}
.frame{position:relative;width:100%;max-width:min(450px,max(200px,calc(100vh - 400px)));aspect-ratio:1/1;background:#000;border:2px solid var(--panel)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--blue);border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.green{background:var(--green)}
button.ghost{background:var(--panel)}
.classes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:960px}
.classes button{background:var(--panel);font-weight:bold;padding:12px 6px;border:2px solid transparent;line-height:1.25}
.classes button small{display:block;font-weight:normal;color:var(--muted);font-size:12px}
.classes button.on{border-color:var(--sel);background:#0A0909;color:var(--sel)}
.opts{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
.opts input[type=number]{width:72px;background:var(--panel);border:0;color:var(--fg);padding:4px 6px;border-radius:4px}
.keys{font-size:12px;color:var(--muted);text-align:center;max-width:960px}
#feedback{position:absolute;left:50%;top:calc(50% + 10px);transform:translate(-50%,-50%);z-index:5;pointer-events:none;
  max-width:min(92%,380px);padding:6px 18px;border-radius:12px;background:rgba(20,30,40,.82);box-shadow:0 2px 12px rgba(0,0,0,.5);
  font-size:26px;font-weight:bold;color:#2ECC71;text-align:center;line-height:1.3}
#feedback:empty{display:none}
#feedback.kept{font-size:16px;opacity:.92;padding:4px 12px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#overlay.show{display:flex}
.card{background:var(--bg);border:2px solid #7D3C98;border-radius:8px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card input[type=text]{font:inherit;padding:8px;border-radius:4px;border:0;background:var(--panel);color:var(--fg)}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.card a{color:#8ec9f5}
.packs{display:flex;flex-direction:column;gap:8px}
@media (max-height:800px) and (min-width:701px){
  main{padding:6px 16px 8px;gap:6px}header{padding:4px 16px}
  .classes button{padding:5px 6px}.keys{display:none}
  .view{flex-basis:min(450px,max(200px,calc(100vh - 305px)))}.frame{max-width:min(450px,max(200px,calc(100vh - 305px)))}
}
@media (max-width:700px){
  .classes{grid-template-columns:repeat(2,minmax(0,1fr))}.keys{display:none}
  main{padding:8px}
  #feedback{font-size:16px;padding:4px 10px}#feedback.kept{font-size:13px;padding:3px 8px}
  .views{flex-wrap:nowrap;gap:6px}.view{flex:1 1 0}.view h3{font-size:11px}
}
</style>
</head>
<body>
<header>
  <b>🐛 อายุหนอน (เกณฑ์ใหม่)</b>
  <span class="chip" id="chipPack">pack: -</span>
  <span class="chip" id="chipUser">user: -</span>
  <span class="chip" id="chipCount">0 / 0</span>
  <button id="bRule" class="ghost" style="padding:2px 10px;font-size:13px">📖 เกณฑ์</button>
  <span class="spacer"></span>
  <span class="chip" id="chipSync">sync: -</span>
</header>
<div id="bar"><i></i></div>

<main>
  <div class="views">
    <div class="view">
      <h3>บริบท — เส้นเหลือง = ตัวที่ถาม</h3>
      <div class="frame"><img id="imgCtx" alt=""></div>
      <small id="tId">&nbsp;</small>
    </div>
    <div class="view">
      <h3>ตัวที่ถาม (ดูสี)</h3>
      <div class="frame"><img id="imgClose" alt=""></div>
    </div>
    <div id="feedback" aria-live="polite"></div>
  </div>

  <div class="controls">
    <button id="bPrev" class="ghost">◀ ก่อนหน้า (Backspace / ← / a)</button>
    <button id="bNext" class="ghost">ถัดไป (Space / → / d) ▶</button>
    <button id="bTodo" class="ghost">ไปรูปที่ยังไม่ตอบ (n)</button>
    <button id="bSave" class="green">💾 บันทึก (s)</button>
    <button id="bCsv" class="ghost">⬇ Download CSV</button>
  </div>

  <div class="classes" id="classes"></div>

  <div class="opts">
    <label>ไปรูปที่ <input type="number" id="jump" min="1"> <button id="bJump" class="ghost" style="padding:3px 10px">ไป</button></label>
    <button id="bUser" class="ghost" style="padding:3px 10px">เปลี่ยนชื่อ</button>
  </div>

  <div class="keys">
    ปุ่ม: 1–8 เลือกคำตอบ (แล้วไปรูปถัดไปอัตโนมัติ) · 0 ล้างคำตอบ · Space/→/d ถัดไป · Backspace/←/a ย้อน · n ไปรูปที่ยังไม่ตอบ · s บันทึก
  </div>
</main>

<div id="overlay"><div class="card" id="card"></div></div>

<script>
"use strict";
const FLUSH_EVERY = 10, FLUSH_MS = 15000, BATCH = 200, PREFETCH = 6;
const ADVANCE_MS = 600;   // show "✅ <label>" then go to next image

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const S = {
  cfg: {endpoint: "", token: ""},
  pack: qs.get("pack") || "",
  user: "",
  manifest: null,
  classes: [],      // from manifest.classes: {code,key,value,label,hint}
  items: [],        // [[instance_id, file_hash], ...]
  labels: {},       // instance_id -> [code, ts]
  queue: [],        // unsent events
  idx: 0,
  inflight: false,
  retryDelay: FLUSH_MS,
  lastError: "",
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clsOf = code => S.classes.find(c => c.code === code);

// ---- safe storage ----
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};
const lkey = () => `wla:${S.pack}:${S.user}`;
const qkey = () => `wlaq:${S.pack}:${S.user}`;
const pkey = () => `wlapos:${S.pack}:${S.user}`;
const skey = () => `wlaseen:${S.pack}:${S.user}`;
function persist(){
  store.set(lkey(), JSON.stringify(S.labels));
  store.set(qkey(), JSON.stringify(S.queue));
}
// packs live in a separate site (config.packsBase); empty = same site
const packsBase = () => S.cfg.packsBase ? S.cfg.packsBase.replace(/\/+$/, "") + "/" : "";
const packUrl = p => `${packsBase()}packs/${encodeURIComponent(S.pack)}/${p}`;

// ---- overlay dialogs ----
function dialog(html){ $("card").innerHTML = html; $("overlay").classList.add("show"); }
function closeDialog(){ $("overlay").classList.remove("show"); }

function askName(){
  return new Promise(res => {
    dialog(`<h3 style="margin:0">ใส่ชื่อผู้ตอบ</h3>
      <div style="color:var(--muted);font-size:13px">ใช้ตัวอักษร/ตัวเลข/ขีด ไม่เกิน 30 ตัว — ใช้แยกผลของแต่ละคน และคืนสถานะเมื่อเปิดซ้ำ</div>
      <input type="text" id="nameIn" maxlength="30" value="${esc(S.user)}">
      <button id="nameOk">ตกลง</button>`);
    const ok = () => {
      const v = $("nameIn").value.trim().replace(/[^\w฀-๿-]/g, "");
      if(!v) return;
      closeDialog(); res(v);
    };
    $("nameOk").onclick = ok;
    $("nameIn").onkeydown = e => { e.stopPropagation(); if(e.key === "Enter") ok(); };
    $("nameIn").focus();
  });
}

async function pickPack(){
  let list = [];
  try{ list = await (await fetch(packsBase() + "packs/index.json", {cache:"no-store"})).json(); }catch(e){}
  list = list.filter(p => p.task === "age");
  if(!list.length){
    dialog(`<h3 style="margin:0">ไม่พบชุดข้อมูล</h3><div>เปิดลิงก์ที่มี <code>?pack=ชื่อชุด</code> เช่น <code>?pack=R1_01</code></div>`);
    return;
  }
  dialog(`<h3 style="margin:0">เลือกชุดข้อมูล (อายุหนอน)</h3><div class="packs">` +
    list.map(p => `<button data-p="${esc(p.id)}">${esc(p.id)} (${esc(p.n)} รูป)</button>`).join("") + `</div>`);
  document.querySelectorAll(".packs button").forEach(b => b.onclick = () => {
    const u = new URL(location.href); u.searchParams.set("pack", b.dataset.p); location.href = u;
  });
}

function showRule(first){
  dialog(`<h3 style="margin:0">📖 เกณฑ์อายุหนอน (ใหม่)</h3>
    <ul>
      <li><b>ใช้เกณฑ์นี้เท่านั้น (อย่าใช้เกณฑ์เดิม)</b></li>
      <li><b>2 หนอนพอดี</b> = เขียวนวลอ่อน ยังไม่เห็นลาย</li>
      <li><b>3 หนอนแก่</b> = เริ่มเห็นลายดำ และ/หรือ ท้องกับหลังสีต่างกัน และตัวใหญ่กว่าเด็ก</li>
      <li><b>8 หนอนกำกึ่ง</b> = อยู่ระหว่างพอดีกับแก่ มีลายจางๆ นิดหน่อย</li>
      <li><b>4 หนอนระบุรุ่นไม่ได้</b> = เห็นตัว แต่ดูอายุไม่ออก (เบลอ/โดนบัง)</li>
      <li><b>6 รูปแหว่ง/พลาด</b> = mask ไม่ครบตัว หรือเกิน 1 ตัว (ติดตัวอื่น/ติดเศษ) — <b>ห้ามตอบอายุ</b></li>
      <li>1, 5, 7 ใช้เหมือนโปรแกรมลาเบลเดิม</li>
      <li>ภาพซ้าย = บริบท เส้นเหลือง = ตัวที่ถาม · ภาพขวา = ตัวเดียวกันแบบใกล้ ไว้ดูสี</li>
    </ul>
    <button id="dOk">${first ? "เข้าใจแล้ว เริ่มเลย" : "ปิด"}</button>`);
  $("dOk").onclick = () => { closeDialog(); if(first) store.set(skey(), "1"); };
}

// ---- sync ----
function setSync(text, cls){
  const c = $("chipSync"); c.textContent = "sync: " + text; c.className = "chip " + (cls || "");
}
function updateSyncChip(){
  if(!S.cfg.endpoint){ setSync("ไม่ได้ตั้งค่า (ใช้ Download CSV)", "warn"); return; }
  if(S.lastError){ setSync(`ส่งไม่สำเร็จ (${S.queue.length} รอส่ง)`, "err"); return; }
  if(S.inflight){ setSync("กำลังส่ง…", "warn"); return; }
  setSync(S.queue.length ? `รอส่ง ${S.queue.length}` : "ส่งครบแล้ว ✓", S.queue.length ? "warn" : "ok");
}
async function flush(force){
  if(!S.cfg.endpoint || S.inflight || !S.queue.length) { updateSyncChip(); return; }
  S.inflight = true; updateSyncChip();
  const batch = S.queue.slice(0, BATCH);
  try{
    const r = await fetch(S.cfg.endpoint, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},   // simple request: no CORS preflight
      body: JSON.stringify({action:"labels", token:S.cfg.token, rows:batch}),
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "server error");
    // server silently drops rows it does not accept (e.g. old Apps Script rejects Class 7): keep the queue, show error
    if(j.n !== batch.length) throw new Error(`server รับ ${j.n}/${batch.length} แถว`);
    S.queue.splice(0, batch.length);
    S.lastError = ""; S.retryDelay = FLUSH_MS;
    persist();
  }catch(e){
    S.lastError = String(e.message || e);
    S.retryDelay = Math.min(S.retryDelay * 2, 120000);
  }
  S.inflight = false; updateSyncChip();
  if(S.queue.length && !S.lastError) flush();
}
setInterval(() => flush(), FLUSH_MS);
setInterval(() => { if(S.lastError) { S.lastError = ""; flush(); } }, 60000);
window.addEventListener("online", () => { S.lastError = ""; flush(); });
function beaconFlush(){
  if(!S.cfg.endpoint || !S.queue.length || !navigator.sendBeacon) return;
  try{
    navigator.sendBeacon(S.cfg.endpoint, new Blob(
      [JSON.stringify({action:"labels", token:S.cfg.token, rows:S.queue.slice(0, BATCH)})],
      {type:"text/plain;charset=utf-8"}));
  }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden"){ persist(); beaconFlush(); } });
window.addEventListener("pagehide", () => { persist(); beaconFlush(); });

async function pullRemote(){
  if(!S.cfg.endpoint) return;
  try{
    const u = `${S.cfg.endpoint}?action=get&pack=${encodeURIComponent(S.pack)}&user=${encodeURIComponent(S.user)}&token=${encodeURIComponent(S.cfg.token)}`;
    const j = await (await fetch(u)).json();
    if(!j.ok) return;
    for(const [f, v] of Object.entries(j.labels || {})){
      const cur = S.labels[f];
      if(!cur || v[1] > cur[1]) S.labels[f] = v;
    }
    persist();
  }catch(e){ /* offline: local only */ }
}

// ---- labelling ----
const curCode = () => { const it = S.items[S.idx]; const l = it && S.labels[it[0]]; return l ? l[0] : -1; };
function setLabel(c){
  const it = S.items[S.idx]; if(!it) return;
  if(c >= 0 && !clsOf(c)) return;
  const ts = Date.now();
  if(c < 0) delete S.labels[it[0]]; else S.labels[it[0]] = [c, ts];
  S.queue.push({ts: new Date(ts).toISOString(), pack:S.pack, labeler:S.user, Class:c, Filename:it[0], file_hash:it[1]});
  cancelAdvance();
  if(c >= 0){
    S.flash = true;
    const at = S.idx;
    S.timer = setTimeout(() => {
      S.timer = null; S.flash = false;
      if(S.idx === at && at < S.items.length - 1) go(at + 1); else render();
    }, ADVANCE_MS);
  }
  persist(); render();
  if(S.queue.length >= FLUSH_EVERY) flush();
}
function cancelAdvance(){
  if(S.timer){ clearTimeout(S.timer); S.timer = null; }
  S.flash = false;
}
function go(i){
  cancelAdvance();   // a manual move during the 600 ms must not be followed by a second automatic one
  if(i < 0 || i >= S.items.length) return;
  S.idx = i; store.set(pkey(), String(i)); render();
}
function nextTodo(from){
  const n = S.items.length;
  for(let k = 1; k <= n; k++){
    const i = (from + k) % n;
    if(!S.labels[S.items[i][0]]) return i;
  }
  return -1;
}

// ---- rendering ----
const preloaded = new Map();
function preload(i){
  if(i < 0 || i >= S.items.length) return;
  const s = S.items[i][0];
  if(preloaded.has(s)) return;
  const a = new Image(), b = new Image();
  a.src = packUrl(`ctx/${s}.jpg`); b.src = packUrl(`close/${s}.jpg`);
  preloaded.set(s, [a, b]);
  if(preloaded.size > 60) preloaded.delete(preloaded.keys().next().value);
}
function render(){
  const n = S.items.length;
  const done = Object.keys(S.labels).length;
  $("chipCount").textContent = `ตอบแล้ว ${done} / ${n}`;
  $("bar").firstElementChild.style.width = n ? (100 * done / n) + "%" : "0";
  if(!n) return;
  const it = S.items[S.idx], s = it[0];
  $("tId").textContent = `(${S.idx + 1}/${n}) ${s}`;
  document.title = `อายุหนอน - ${s}`;
  $("imgCtx").src = packUrl(`ctx/${s}.jpg`);
  $("imgClose").src = packUrl(`close/${s}.jpg`);
  const c = curCode();
  document.querySelectorAll("#classes button").forEach(b => b.classList.toggle("on", +b.dataset.c === c));
  const cl = clsOf(c);
  $("feedback").textContent = !cl ? "" : (S.flash ? "✅ " : "📌 เลือก: ") + cl.label;
  $("feedback").className = S.flash ? "flash" : "kept";
  $("bPrev").disabled = S.idx === 0;
  $("bNext").disabled = S.idx >= n - 1;
  $("jump").max = n;
  for(let k = 1; k <= PREFETCH; k++) preload(S.idx + k);
  preload(S.idx - 1);
  updateSyncChip();
  if(done === n && !S._doneShown){
    S._doneShown = true;
    dialog(`<h3 style="margin:0">ตอบครบทุกรูปแล้ว 🎉</h3>
      <div>ข้อมูลถูกส่งอัตโนมัติ${S.cfg.endpoint ? "" : " — <b>ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์ กรุณากด Download CSV แล้วส่งให้ผู้ดูแล</b>"}</div>
      <button id="dOk">ตกลง</button>`);
    $("dOk").onclick = () => { closeDialog(); flush(); };
  }
}

function buildCsv(){
  const lines = ["instance_id,answer,code"];
  for(const [f] of S.items){
    const l = S.labels[f]; if(!l) continue;
    const cl = clsOf(l[0]);
    lines.push(`${f},${cl ? cl.value : ""},${l[0]}`);
  }
  return lines.join("\n") + "\n";
}
function downloadCsv(){
  const blob = new Blob([buildCsv()], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `age_${S.pack}_${S.user}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---- input (e.code so a Thai keyboard layout works) ----
function onKey(e){
  if($("overlay").classList.contains("show")) return;
  const t = e.target && e.target.tagName;
  if(t === "INPUT" && e.target.type !== "checkbox") return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const c = e.code;
  let handled = true, m;
  if(c === "Space" || c === "ArrowRight" || c === "KeyD") go(S.idx + 1);
  else if(c === "Backspace" || c === "ArrowLeft" || c === "KeyA") go(S.idx - 1);
  else if((m = /^(?:Digit|Numpad)([1-9])$/.exec(c))){
    const cl = S.classes.find(x => String(x.key) === m[1]);
    if(cl) setLabel(cl.code); else handled = false;
  }
  else if(c === "Digit0" || c === "Numpad0" || c === "Delete") setLabel(-1);
  else if(c === "KeyS") saveNow();
  else if(c === "KeyN") jumpTodo();
  else handled = false;
  if(handled) e.preventDefault();
}
function jumpTodo(){
  const i = nextTodo(S.idx);
  if(i < 0){ setSync("ไม่มีรูปที่ยังไม่ตอบแล้ว", "ok"); setTimeout(updateSyncChip, 2000); } else go(i);
}
async function saveNow(){ persist(); S.lastError = ""; await flush(true); }

async function renameUser(){
  persist();
  const v = await askName();
  const u = new URL(location.href); u.searchParams.set("u", v); store.set("wl:name", v); location.href = u;
}

// ---- boot ----
async function boot(){
  $("bPrev").onclick = () => go(S.idx - 1);
  $("bNext").onclick = () => go(S.idx + 1);
  $("bTodo").onclick = jumpTodo;
  $("bSave").onclick = saveNow;
  $("bCsv").onclick = downloadCsv;
  $("bJump").onclick = () => { const v = parseInt($("jump").value, 10); if(v >= 1) go(Math.min(v, S.items.length) - 1); };
  $("bUser").onclick = renameUser;
  $("bRule").onclick = () => showRule(false);
  document.addEventListener("keydown", onKey);

  try{ Object.assign(S.cfg, await (await fetch("../config.json", {cache:"no-store"})).json()); }catch(e){}
  if(!S.pack){ updateSyncChip(); return pickPack(); }

  S.user = (qs.get("u") || store.get("wl:name") || "").replace(/[^\w฀-๿-]/g, "").slice(0, 30);
  if(!S.user) S.user = await askName();
  store.set("wl:name", S.user);

  $("chipPack").textContent = "pack: " + S.pack;
  $("chipUser").textContent = "user: " + S.user;

  let m;
  try{
    m = await (await fetch(packUrl("manifest.json"), {cache:"no-store"})).json();
    if(!m || !Array.isArray(m.items)) throw new Error("bad manifest");
  }catch(e){
    dialog(`<h3 style="margin:0">โหลดชุดข้อมูลไม่ได้</h3><div>pack "${esc(S.pack)}" ไม่มีอยู่ หรือเครือข่ายมีปัญหา</div>`);
    return;
  }
  if(m.task !== "age"){
    dialog(`<h3 style="margin:0">ชุดนี้ไม่ใช่งานอายุหนอน</h3>
      <div>pack "${esc(S.pack)}" เป็นงานลาเบล 7 คลาส — เปิดที่หน้านี้แทน:</div>
      <a href="../?pack=${encodeURIComponent(S.pack)}&u=${encodeURIComponent(S.user)}">../?pack=${esc(S.pack)}</a>`);
    return;
  }
  S.manifest = m; S.items = m.items; S.classes = m.classes || [];

  const box = $("classes");
  S.classes.forEach(cl => {
    const b = document.createElement("button");
    b.dataset.c = cl.code;
    b.innerHTML = `${esc(cl.label)}<small>กด ${esc(cl.key)}${cl.hint ? " · " + esc(cl.hint) : ""}</small>`;
    b.onclick = () => setLabel(cl.code);
    box.appendChild(b);
  });

  try{ S.labels = JSON.parse(store.get(lkey()) || "{}"); }catch(e){ S.labels = {}; }
  try{ S.queue = JSON.parse(store.get(qkey()) || "[]"); }catch(e){ S.queue = []; }
  const valid = new Set(S.items.map(x => x[0]));
  for(const f of Object.keys(S.labels)) if(!valid.has(f)) delete S.labels[f];

  render();
  if(!store.get(skey())) showRule(true);
  await pullRemote();

  const pos = parseInt(store.get(pkey()) || "-1", 10);
  const first = nextTodo(pos >= 0 && pos < S.items.length ? pos - 1 : S.items.length - 1);
  S.idx = first >= 0 ? first : Math.max(0, Math.min(pos, S.items.length - 1));
  S._doneShown = Object.keys(S.labels).length === S.items.length;   // don't pop "done" on reopen
  render();
  flush();
}
boot();
</script>
</body>
</html>
